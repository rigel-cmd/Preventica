# Publie les données du salon : à chaque dépôt d'une sauvegarde de l'app dans donnees/,
# régénère le bilan (donnees/README.md), les synthèses, les contacts et les photos.
name: Publier les données du salon

on:
  push:
    branches: [main]
    paths:
      - 'donnees/sauvegarde*.json'
      - 'outils/publier-donnees.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: donnees
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Générer les fichiers lisibles
        run: node outils/publier-donnees.mjs .
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A donnees
          if git diff --cached --quiet; then
            echo "Rien de nouveau à publier."
          else
            git commit -m "Publie les données du salon"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
